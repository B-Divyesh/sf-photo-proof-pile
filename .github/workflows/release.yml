name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (for example, v0.1.23)
        required: true
        type: string
      source_commit:
        description: Exact immutable source commit to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      source_version: ${{ steps.identity.outputs.source_version }}
      release_version: ${{ steps.identity.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_commit || inputs.tag || github.ref }}
      - name: Require the exact versioned desktop source
        id: identity
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          source_version=$(node -p "require('./package.json').version")
          release_tag="${REQUESTED_TAG:-$REF_NAME}"
          release_version="${release_tag#v}"
          if ! node -e 'if (!/^\d+\.\d+\.\d+$/.test(process.argv[1])) process.exit(1)' "$release_version"; then
            echo "Release tag $release_tag is not a stable semantic version." >&2
            exit 1
          fi
          release_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse --verify --quiet "refs/tags/${release_tag}^{}" || true)
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$release_commit" ]; then
            echo "Release tag does not resolve to the checked-out source." >&2
            exit 1
          fi
          if [ -n "$REQUESTED_COMMIT" ] && [ "$release_commit" != "$REQUESTED_COMMIT" ]; then
            echo "Checked-out source does not match requested commit." >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$release_tag" != "v${source_version}" ]; then
            echo "Tag release $release_tag does not match source version v${source_version}." >&2
            exit 1
          fi
          if [ "$release_version" != "$source_version" ]; then
            if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ -z "$REQUESTED_COMMIT" ]; then
              echo "A versioned repair requires workflow_dispatch and an exact source commit." >&2
              exit 1
            fi
            node - "$source_version" "$release_version" <<'NODE'
          const [source, release] = process.argv.slice(2).map(value => value.split(".").map(Number));
          if (release[0] !== source[0] || release[1] !== source[1] || release[2] !== source[2] + 1) process.exit(1);
          NODE
            if [ -n "$tag_commit" ]; then
              echo "A versioned repair must publish a new immutable tag." >&2
              exit 1
            fi
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runs_on: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            package_path: src-tauri/target/**/release/bundle/dmg/*.dmg
          - name: macos-x64
            runs_on: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            package_path: src-tauri/target/**/release/bundle/dmg/*.dmg
          - name: windows
            runs_on: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            package_path: |
              src-tauri/target/**/release/bundle/msi/*.msi
              src-tauri/target/**/release/bundle/nsis/*.exe
          - name: linux
            runs_on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            package_path: |
              src-tauri/target/**/release/bundle/appimage/*.AppImage
              src-tauri/target/**/release/bundle/deb/*.deb
              src-tauri/target/**/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux packages
        if: matrix.runs_on == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Stamp release version without changing source identity
        if: needs.prepare-release.outputs.release_version != needs.prepare-release.outputs.source_version
        shell: bash
        env:
          SOURCE_VERSION: ${{ needs.prepare-release.outputs.source_version }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const source = process.env.SOURCE_VERSION;
          const release = process.env.RELEASE_VERSION;
          const replaceOnce = (path, before, after) => {
            const value = readFileSync(path, "utf8");
            const found = before instanceof RegExp ? before.test(value) : value.includes(before);
            if (!found) throw new Error(`${path} does not contain the expected source value`);
            writeFileSync(path, value.replace(before, after));
          };
          const updateJson = (path, update) => {
            const value = JSON.parse(readFileSync(path, "utf8"));
            update(value);
            writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          };

          updateJson("package.json", value => { value.version = release; });
          updateJson("package-lock.json", value => {
            value.version = release;
            value.packages[""].version = release;
          });
          updateJson("src-tauri/tauri.conf.json", value => { value.version = release; });
          replaceOnce("src-tauri/Cargo.toml", `version = "${source}"`, `version = "${release}"`);
          replaceOnce("src-tauri/Cargo.lock", `name = "proof-pile"\nversion = "${source}"`, `name = "proof-pile"\nversion = "${release}"`);
          replaceOnce("src/main.ts", `const VERSION = "${source}"`, `const VERSION = "${release}"`);
          replaceOnce("public/404.html", `<p>v${source}</p>`, `<p>v${release}</p>`);
          replaceOnce("public/sw.js", /const CACHE = "[^"]+";/, `const CACHE = "proof-pile-v${release}";`);
          NODE
      - name: Build desktop packages
        env:
          BUILD_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify unsigned macOS package state (@claim:unsigned-package-state)
        if: startsWith(matrix.name, 'macos-')
        shell: bash
        run: bash scripts/verify-unsigned-macos-dmg.sh src-tauri/target/**/release/bundle/dmg/*.dmg
      - name: Verify unsigned Windows package state (@claim:unsigned-package-state)
        if: matrix.name == 'windows'
        shell: pwsh
        run: ./scripts/verify-unsigned-windows.ps1 -Path src-tauri/target
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.package_path }}
          if-no-files-found: error
      - name: Upload the identically stamped static site
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-site
          path: dist/site
          if-no-files-found: error

  publish:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Create SHA-256 file and immutable manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/prepare-release-assets.sh release-assets
      - name: Publish complete desktop release with verified signing state
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          target_commitish: ${{ needs.prepare-release.outputs.commit }}
          name: Proof Pile ${{ needs.prepare-release.outputs.tag }}
          body: |
            Desktop packages built from `${{ needs.prepare-release.outputs.commit }}`.

            macOS packages lack Developer ID distribution signing. Windows packages are Authenticode NotSigned. Verify the package against `SHA256SUMS` before opening it. On macOS, Control-click and choose Open. On Windows, inspect the publisher warning before continuing.
          files: release-assets/published/*
          fail_on_unmatched_files: true
      - name: Verify public release identity, manifest, and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
        run: bash scripts/verify-published-release.sh
