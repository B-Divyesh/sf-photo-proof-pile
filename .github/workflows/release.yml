name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v0.1.13)
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Require a versioned tag for this exact desktop source
        id: identity
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          expected_tag="v${version}"
          release_tag="${REQUESTED_TAG:-$REF_NAME}"
          if [ "$release_tag" != "$expected_tag" ]; then
            echo "Release tag $release_tag does not match package version $expected_tag." >&2
            exit 1
          fi
          git rev-parse "${release_tag}^{commit}" >/dev/null
          release_commit=$(git rev-parse "${release_tag}^{commit}")
          if [ "$release_commit" != "$(git rev-parse HEAD)" ]; then
            echo "Checked-out source does not match $release_tag." >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
      - name: Create a draft release before matrix uploads
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id=$(gh release view "${{ steps.identity.outputs.tag }}" --json databaseId --jq .databaseId 2>/dev/null || true)
          if [ -z "$release_id" ]; then
            gh release create "${{ steps.identity.outputs.tag }}" --draft \
              --title "Proof Pile ${{ steps.identity.outputs.tag }}" \
              --notes "Desktop packages for local duplicate-photo review. Packages without a verified signature marker are unsigned."
            release_id=$(gh release view "${{ steps.identity.outputs.tag }}" --json databaseId --jq .databaseId)
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-release
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERT_PFX != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux packages
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "proof-pile-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Compress -Depth 4
          "TAURI_CONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify Windows installer checksum gate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./tests/install-windows.ps1
      - name: Build signed macOS package
        if: startsWith(matrix.platform, 'macos') && env.HAS_APPLE_CERTIFICATE == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Proof Pile v__VERSION__
          releaseBody: Desktop packages for local duplicate-photo review.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Build signed Windows package
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Proof Pile v__VERSION__
          releaseBody: Desktop packages for local duplicate-photo review.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Build package without a signing certificate
        if: matrix.platform == 'ubuntu-latest' || (startsWith(matrix.platform, 'macos') && env.HAS_APPLE_CERTIFICATE != 'true') || (matrix.platform == 'windows-latest' && env.HAS_WINDOWS_CERTIFICATE != 'true')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Proof Pile v__VERSION__
          releaseBody: Desktop packages for local duplicate-photo review. Packages without a verified signature marker are unsigned.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Verify Windows package signature
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path src-tauri/target -Recurse -File | Where-Object { $_.FullName -match '[\\/]bundle[\\/](msi|nsis)[\\/]' -and $_.Extension -in '.msi', '.exe' }
          if (-not $packages) { throw "No Windows packages were built." }
          foreach ($package in $packages) {
            $signature = Get-AuthenticodeSignature $package.FullName
            if ($signature.Status -ne "Valid") { throw "$($package.Name) has no valid Authenticode signature." }
          }
      - name: Verify macOS package signature and notarization
        if: startsWith(matrix.platform, 'macos') && env.HAS_APPLE_CERTIFICATE == 'true'
        run: |
          app_count=0
          while IFS= read -r -d '' app; do
            app_count=$((app_count + 1))
            codesign --verify --deep --strict "$app"
            spctl --assess --type execute --verbose "$app"
          done < <(find src-tauri/target -path '*.app' -type d -prune -print0)
          test "$app_count" -gt 0
          dmg_count=0
          while IFS= read -r -d '' dmg; do
            dmg_count=$((dmg_count + 1))
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          done < <(find src-tauri/target -path '*/bundle/dmg/*.dmg' -type f -print0)
          test "$dmg_count" -gt 0

  checksums:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERT_PFX != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-assets
          gh release download "${{ needs.prepare-release.outputs.tag }}" --dir release-assets
      - name: Write checksums and immutable release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          cd release-assets
          rm -f SHA256SUMS latest.json DESKTOP_SIGNATURES_VERIFIED.json
          apple_status=unsigned
          windows_status=unsigned
          if [ "$HAS_APPLE_CERTIFICATE" = "true" ]; then apple_status=signed-and-notarized; fi
          if [ "$HAS_WINDOWS_CERTIFICATE" = "true" ]; then windows_status=authenticode-signed; fi
          if [ "$HAS_APPLE_CERTIFICATE" = "true" ] && [ "$HAS_WINDOWS_CERTIFICATE" = "true" ]; then
            printf '%s\n' '{"macos":"signed-and-notarized","windows":"authenticode-signed"}' > DESKTOP_SIGNATURES_VERIFIED.json
          fi
          : > SHA256SUMS
          while IFS= read -r -d '' asset; do sha256sum "$asset" | sed 's#  \./#  #' >> SHA256SUMS; done < <(find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name latest.json -print0 | sort -z)
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release.json
          jq --arg commit "$RELEASE_COMMIT" --arg apple "$apple_status" --arg windows "$windows_status" \
            '{version: .tag_name, commit: $commit, signatures: {macos: $apple, windows: $windows}, platforms: {macos: [.assets[] | select(.name | test("\\.dmg$")) | {name, url: .browser_download_url}], windows: [.assets[] | select(.name | test("\\.(msi|exe)$")) | {name, url: .browser_download_url}], linux: [.assets[] | select(.name | test("\\.(AppImage|deb)$")) | {name, url: .browser_download_url}]}}' \
            release.json > latest.json
          rm release.json
          jq -e --arg commit "$RELEASE_COMMIT" '.commit == $commit and (.platforms.macos | length) >= 2 and (.platforms.windows | length) >= 1 and (.platforms.linux | length) >= 2' latest.json
      - name: Upload checksums and release manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: |
            release-assets/SHA256SUMS
            release-assets/latest.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload verified-signatures marker
        if: env.HAS_APPLE_CERTIFICATE == 'true' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: release-assets/DESKTOP_SIGNATURES_VERIFIED.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only after every platform and checksum passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare-release.outputs.tag }}" --draft=false --latest

  verify-release:
    needs: [prepare-release, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Verify published identity, package matrix, and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
        run: |
          mkdir verified-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir verified-release
          cd verified-release
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
            '.version == $tag and .commit == $commit and (.platforms.macos | length) >= 2 and (.platforms.windows | length) >= 1 and (.platforms.linux | length) >= 2' latest.json
          sha256sum -c SHA256SUMS
