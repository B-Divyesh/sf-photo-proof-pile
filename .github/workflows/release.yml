name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (for example, v0.1.23)
        required: true
        type: string
      source_commit:
        description: Exact source commit to package; leave empty for the selected tag
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_commit || inputs.tag || github.ref }}
      - name: Require the exact versioned desktop source
        id: identity
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          expected_tag="v${version}"
          release_tag="${REQUESTED_TAG:-$REF_NAME}"
          if [ "$release_tag" != "$expected_tag" ]; then
            echo "Release tag $release_tag does not match package version $expected_tag." >&2
            exit 1
          fi
          release_commit=$(git rev-parse HEAD)
          if [ -n "$REQUESTED_COMMIT" ] && [ "$release_commit" != "$REQUESTED_COMMIT" ]; then
            echo "Checked-out source does not match requested commit." >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runs_on: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            package_path: src-tauri/target/**/release/bundle/dmg/*.dmg
          - name: macos-x64
            runs_on: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            package_path: src-tauri/target/**/release/bundle/dmg/*.dmg
          - name: windows
            runs_on: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            package_path: |
              src-tauri/target/**/release/bundle/msi/*.msi
              src-tauri/target/**/release/bundle/nsis/*.exe
          - name: linux
            runs_on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            package_path: |
              src-tauri/target/**/release/bundle/appimage/*.AppImage
              src-tauri/target/**/release/bundle/deb/*.deb
              src-tauri/target/**/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux packages
        if: matrix.runs_on == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build desktop packages
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.package_path }}
          if-no-files-found: error

  publish:
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Create SHA-256 file and immutable manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #' > SHA256SUMS
          download_base="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}"
          macos=$(find . -maxdepth 1 -type f -name '*.dmg' -printf '%f\n' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          windows=$(find . -maxdepth 1 -type f \( -name '*.msi' -o -name '*.exe' \) -printf '%f\n' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          linux=$(find . -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -printf '%f\n' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')
          jq -n --arg version "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg base "$download_base" --argjson macos "$macos" --argjson windows "$windows" --argjson linux "$linux" \
            '{version: $version, commit: $commit, signatures: {macos: "unsigned", windows: "unsigned"}, platforms: {macos: ($macos | map({name: ., url: ($base + "/" + .)})), windows: ($windows | map({name: ., url: ($base + "/" + .)})), linux: ($linux | map({name: ., url: ($base + "/" + .)}))}}' > latest.json
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg base "$download_base" '.version == $tag and .commit == $commit and .signatures.macos == "unsigned" and .signatures.windows == "unsigned" and (.platforms.macos | length) >= 2 and (.platforms.windows | length) >= 1 and (.platforms.linux | length) >= 2 and all(.platforms[][]; .url | startswith($base + "/"))' latest.json
          sha256sum -c SHA256SUMS
      - name: Publish complete unsigned desktop release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          target_commitish: ${{ needs.prepare-release.outputs.commit }}
          name: Proof Pile ${{ needs.prepare-release.outputs.tag }}
          body: |
            Desktop packages built from `${{ needs.prepare-release.outputs.commit }}`.

            These packages are unsigned. Verify the package against `SHA256SUMS` before opening it. On macOS, Control-click and choose Open. On Windows, inspect the publisher warning before continuing.
          files: release-assets/*
          fail_on_unmatched_files: true
      - name: Verify one published Linux asset against SHA256SUMS
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-assets
          asset=$(jq -r '.platforms.linux[] | select(.name | endswith(".AppImage")) | .name' latest.json | head -n 1)
          test -n "$asset"
          curl --fail --silent --show-error --location "https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}" --output "published-${asset}"
          expected=$(awk -v name="$asset" '$2 == name { print $1 }' SHA256SUMS)
          actual=$(sha256sum "published-${asset}" | awk '{ print $1 }')
          test -n "$expected"
          test "$expected" = "$actual"
